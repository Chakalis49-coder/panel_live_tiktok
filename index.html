<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papillon Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0a1f44, #1e3c72);
  color: #cfe8ff;
}

/* LOGIN */
#login-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0a1f44, #1e3c72);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-box {
  background: rgba(0,0,0,0.4);
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 20px rgba(100,150,255,0.5);
}

.login-box input {
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  width: 200px;
}

.login-box button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #4da6ff;
  color: white;
}

/* HEADER */
.header {
  display: flex;
  padding: 10px 15px;
  background: rgba(0,0,0,0.3);
  font-weight: bold;
}

.viewer-inline {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  background: rgba(255,255,255,0.08);
  padding: 4px 10px;
  border-radius: 20px;
}

.viewer-inline iframe {
  width: 110px;
  height: 50px;
}

/* WIDGET */
.widget {
  background: rgba(255,255,255,0.06);
  border-radius: 15px;
  padding: 10px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15);
}

.title {
  text-align: center;
  margin-bottom: 5px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
  padding: 10px;
}

@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
  }
}

/* EVENT */
.table {
  display: grid;
  gap: 10px;
}

@media (min-width: 700px) {
  .table {
    grid-template-columns: 1fr 1fr;
  }
}

.event {
  background: rgba(255,255,255,0.05);
  padding: 6px;
  border-radius: 10px;
}

.event-title {
  text-align: center;
  font-size: 13px;
  margin-bottom: 5px;
  background: rgba(0,0,0,0.3);
  padding: 4px;
  border-radius: 6px;
}

iframe {
  width: 100%;
  border: none;
  border-radius: 10px;
}

.chat { height: 500px; }
.gifts { height: 420px; }
.vertical { height: 400px; }

.top-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
</style>
</head>

<body>

<!-- ✅ LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>🦋 Accès Papillon</h2>
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="checkPassword()">Entrer</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div>🦋 PAPILLØN BLA FAMILJA • 👼 Team Renaissance</div>

  <div class="viewer-inline">
    <span>N° 👤 :</span>
    <iframe src="https://tikfinity.zerody.one/widget/viewercount?cid=3193073&label=false"></iframe>
  </div>
</div>

<div class="container">

  <div>
    <div class="widget">
      <div class="title">💬 Chat</div>
      <iframe class="chat" src="https://tikfinity.zerody.one/widget/chat?cid=3193073"></iframe>
    </div>

    <div class="widget">
      <div class="title">🎁 Gifts</div>
      <iframe class="gifts" src="https://tikfinity.zerody.one/widget/gifts?cid=3193073"></iframe>
    </div>

    <div class="widget">
      <div class="title">📊 Viewer & Activité</div>

      <div class="table">
        <div class="event">
          <div class="event-title">👤 Last Follow</div>
          <iframe src="https://tikfinity.zerody.one/widget/lastx?cid=3193073&x=follower"></iframe>
        </div>

        <div class="event">
          <div class="event-title">🎁 Last Gift</div>
          <iframe src="https://tikfinity.zerody.one/widget/lastx?cid=3193073&x=gifter"></iframe>
        </div>

        <div class="event">
          <div class="event-title">⭐ Last Sub</div>
          <iframe src="https://tikfinity.zerody.one/widget/lastx?cid=3193073&x=subscriber"></iframe>
        </div>

        <div class="event">
          <div class="event-title">🔄 Last Share</div>
          <iframe src="https://tikfinity.zerody.one/widget/lastx?cid=3193073&x=share"></iframe>
        </div>

        <div class="event">
          <div class="event-title">❤️ Last Like</div>
          <iframe src="https://tikfinity.zerody.one/widget/lastx?cid=3193073&x=like"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="widget top-grid">
      <div>
        <div class="title">🏆 Top Gifters</div>
        <iframe class="vertical" src="https://tikfinity.zerody.one/widget/topgifter?cid=3193073"></iframe>
      </div>
      <div>
        <div class="title">❤️ Top Likers</div>
        <iframe class="vertical" src="https://tikfinity.zerody.one/widget/topliker?cid=3193073"></iframe>
      </div>
    </div>

    <div class="widget">
      <div class="title">🎵 Song Requests</div>
      <iframe class="vertical" src="https://tikfinity.zerody.one/widget/songrequests?cid=3193073"></iframe>
    </div>
  </div>

</div>

<script>
const correctPassword = "251289";

function checkPassword() {
  const input = document.getElementById("password").value;

  if (input === correctPassword) {
    document.getElementById("login-screen").style.display = "none";
  } else {
    document.getElementById("error").innerText = "Mot de passe incorrect";
  }
}

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    checkPassword();
  }
});
</script>

</body>
</html>
